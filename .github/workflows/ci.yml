name: CI

on:
  push:
    branches: [main, build-core]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The npm scripts mount the plugin at wp-content/plugins/counterprompt, so the
# working copy must live in a directory named exactly "counterprompt" (the repo
# itself is counterprompt_wp). Every job checks out into that path and runs there.
defaults:
  run:
    working-directory: counterprompt

jobs:
  lint:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: counterprompt

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Dev tooling (PHPUnit 9.6 and deps) requires PHP >= 8.1; PHPCS still
          # checks the plugin's 8.0 compatibility via the ruleset's testVersion.
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install Composer dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs

  test:
    name: PHPUnit (wp-env, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported WordPress and the current release line.
        wp: ['6.3', '6.5']
    steps:
      - uses: actions/checkout@v4
        with:
          path: counterprompt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: counterprompt/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Pin WordPress version for this matrix leg
        run: echo '{ "core": "WordPress/WordPress#${{ matrix.wp }}" }' > .wp-env.override.json

      - name: Start wp-env
        run: npx wp-env start

      - name: Install PHP dev dependencies (inside tests container)
        run: npm run setup

      - name: Run PHPUnit
        run: npm run test:php

      - name: Plugin Check (informational)
        continue-on-error: true
        run: |
          npx wp-env run cli wp plugin install plugin-check --activate
          npm run check

      - name: wp-env debug logs on failure
        if: failure()
        run: npx wp-env logs --watch=false || true
